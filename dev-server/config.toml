schema_version = 1

# Clients

[llm_clients.inference_hub]
format = "openai_chat"
# format = "anthropic_messages"
# base_url = "http://113.46.219.251/"
base_url = "http://localhost:25947/proxy"
api_key_env = "NVIDIA_API_KEY"

[llm_clients.local_hub]
format = "openai_chat"
# base_url = "http://192.168.3.5:8090"
base_url = "http://192.168.3.13:8090"
api_key_env = "NVIDIA_API_KEY"

[decision_clients.decisions]
format = "openai_decisions"
endpoint = "https://inference-api.nvidia.com/v1/decisions"
api_key_env = "NVIDIA_API_KEY"
timeout_ms = 5000

# The three models our algos use

[targets.capable]
id = "DeepSeek-V4.1-Flash-1017"
llm_client = "inference_hub"
# extra_body = { reasoning = { effort = "medium" } }

[targets.efficient]
# id = "/Users/jiuwen/Models/Qwen3.5-9B-4bit" # local_hub 上真实的模型 id(qwen3.5-9b 在 hub 上不存在)
id = "/Users/synco/Models/Qwen3.5-9B-4bit" # local_hub 上真实的模型 id(qwen3.5-9b 在 hub 上不存在)
llm_client = "local_hub"
# extra_body = { reasoning = { effort = "medium" } }

[targets.recognizer]
id = "Qwen3.8-Flash"
llm_client = "inference_hub"
# extra_body = { reasoning = { effort = "medium" } }

[decision_targets.classifier]
id = "openai/openai/gpt-6-luna"
decision_client = "decisions"

# Composite route, kept for comparison with the default RSI route.
[routes.composite]
id = "switchyard/composite"
type = "composite"

[routes.composite.classifier]
target = "classifier"
classify_trigger = "user_turn"
fail_open = false

[routes.composite.classifier.decision]
cutoff = 0.4
candidates = { a = "capable", b = "efficient" }
evidence = { description = "Candidate a is the larger reasoning-oriented coding and thinking model. It is intended for complex problems. Candidate b is the smaller fast coding model. It is intended for simple questions, simple local reads and edits, routine tests and straightforward fixes. These are qualitative deployment roles, not empirical success rates." }

[routes.composite.stage]
capable_target = "capable"
efficient_target = "efficient"
efficient_first_threshold = 0.5
capable_first_threshold = 0.2

# Basic routes

[routes.random]
id = "switchyard/random"
type = "random"
targets = ["capable", "efficient"]

[routes.passthrough]
id = "switchyard/passthrough"
type = "passthrough"
target = "efficient"

[routes.noop]
id = "switchyard/noop"
type = "noop"

# Stage

[routes.stage]
id = "switchyard/stage"
type = "stage_router"
capable_target = "capable"
efficient_target = "efficient"
picker = "efficient_first"
confidence_threshold = 0.5
recent_turn_window = 3

[routes.stage.handoff_notes]
escalation_note = "[router-guidance] A weaker model was handling this task and showed signs of stalling, looping, or repeated errors on the preceding steps, so control was escalated to you, a stronger model. Re-examine the current state directly and do not simply repeat the previous approach."
only_on_wrong_signal_escalation = true

# Classifier

[routes.classifier]
id = "switchyard/classifier"
type = "llm_classifier"
mode = "capability"
classifier_target = "capable"
strong_target = "capable"
weak_target = "efficient"
base_threshold = 0.5
classify_trigger = "new_session"
message_hash_fallback = true

# Advisor

[routes.advisor]
id = "switchyard/advisor"
type = "advisor"
executor_target = "efficient"
advisor_target = "capable"
max_reviews = 3
gate_stall_turns = 30
gate_min_tool_results = 3

# Codex "Approve for me" reviews

# With "Approve for me" on, Codex sends each review request to the model
# codex-auto-review, unless Codex is logged in with an OpenAI API key. Reviews
# go to the efficient model because Codex waits for each one before it acts.
# Codex asks for low reasoning effort in every review, and extra_body only adds
# an effort when the request has none, so reviews run at low effort.

[routes.codex_auto_review]
id = "codex-auto-review"
type = "passthrough"
target = "efficient"

# Default route: RSI router
#
# It reads a MySQL URL from RSI_MYSQL_URL. The server first reads the `subtask`
# table (subtask_id, subtask_name, definition), includes every subtask's ID,
# name, and definition in the recognizer prompt, and only after recognition
# reads the `candidate_model` rows of the recognized subtask. It drops candidates
# below `min_success_rate` (0 disables the filter), orders the rest by `selection`
# (highest_success, lowest_cost, or lowest_latency), and routes to the first one.
# It injects the `skill_content` with the highest `skill_version` among the
# recognized subtask's valid candidates (`is_valid` not 0) as a `<skill_reminder>`
# message (user role for
# OpenAI formats, system role for Anthropic). Every request gets one reminder; an
# existing reminder for the same subtask is not repeated.
# `skill_injected = false` turns the reminder off.
# If the variable is unset, the URL is invalid, or a query fails, the route uses
# the flagship model and keeps serving.
#
# Tables:
# CREATE TABLE subtask (
#   subtask_id   VARCHAR(191) PRIMARY KEY,
#   subtask_name VARCHAR(255) NOT NULL DEFAULT '',
#   definition   TEXT NOT NULL  -- 要做什么、输入是什么、预期产出、典型失败点
# );
# CREATE TABLE candidate_model (
#   subtask_id    VARCHAR(191) NOT NULL,
#   model_id      VARCHAR(255) NOT NULL,  -- 必须是 candidate_targets 里某个 target 的 id
#   cost          DOUBLE NOT NULL,
#   latency       DOUBLE NOT NULL,        -- 毫秒（也可命名为 latency_ms）
#   success       DOUBLE NOT NULL,        -- 也可命名为 success_rate；0 到 1，或 1 到 100 的百分比
#   skill_content TEXT NULL,
#   skill_version DOUBLE NOT NULL DEFAULT 0,  -- 数值最大的 skill_content 会被注入
#   is_valid      TINYINT(1) NOT NULL DEFAULT 1,  -- 0 表示该行不参与 skill 注入
#   PRIMARY KEY (subtask_id, model_id)
# );

[routes.auto]
id = "switchyard/auto"
type = "rsi_router"
recognizer_target = "recognizer" # 小模型 S
flagship_target = "capable" # 兜底模型
candidate_targets = ["capable", "efficient"] # 执行模型池
mysql_url_env = "RSI_MYSQL_URL"
confidence_threshold = 0.7
min_success_rate = 1
fixed_target = "efficient"  # 设置后所有请求都用该 target 执行，跳过筛选排序，不再回退 flagship_target；未识别/字典失败时也一样
history_steps = 6
selection = "lowest_cost"
# selection = "highest_success"
# selection = "lowest_latency"
skill_injected = true  # false=不注入；true=在 is_valid 非 0 的候选中注入 skill_version 最大的 skill_content

# Explicit alias for clients that still send switchyard/rsi.
[routes.rsi]
id = "switchyard/rsi"
type = "rsi_router"
recognizer_target = "recognizer"
flagship_target = "efficient"
candidate_targets = ["capable", "efficient"]
mysql_url_env = "RSI_MYSQL_URL"
confidence_threshold = 0.7
min_success_rate = 1
# fixed_target = "capable"  # 设置后所有请求都用该 target 执行，跳过筛选排序，不再回退 flagship_target
history_steps = 6
selection = "lowest_cost"
# selection = "highest_success"
# selection = "lowest_latency"
skill_injected = false  # false 时不注入；true 时在 is_valid 非 0 的候选中注入 skill_version 最大的 skill_content

