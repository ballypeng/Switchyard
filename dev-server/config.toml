schema_version = 1

# Clients

[llm_clients.inference_hub]
format = "openai_responses"
base_url = "http://113.46.219.251:8080/v1"
api_key_env = "NVIDIA_API_KEY"

# Local OpenAI-compatible servers. Change the host or port to match each server.
[llm_clients.local_ollama]
format = "openai_chat"
base_url = "http://127.0.0.1:11434/v1"
timeout_ms = 120000

[llm_clients.local_vllm]
format = "openai_chat"
base_url = "http://127.0.0.1:8000/v1"
timeout_ms = 120000

[decision_clients.decisions]
format = "openai_decisions"
endpoint = "https://inference-api.nvidia.com/v1/decisions"
api_key_env = "NVIDIA_API_KEY"
timeout_ms = 5000

# Models our routes use: two cloud models and two local models.

[targets.capable]
id = "Qwen3.8-Flash"
llm_client = "inference_hub"
extra_body = { reasoning = { effort = "medium" } }

[targets.efficient]
id = "DeepSeek-V4.1-Flash-1017"
llm_client = "inference_hub"
extra_body = { reasoning = { effort = "medium" } }

# Must match the name the local server reports. For Ollama, use `ollama list`.
[targets.local_qwen]
id = "qwen2.5-coder:7b"
llm_client = "local_ollama"

# Must match vLLM's --served-model-name.
[targets.local_llama]
id = "meta-llama/Llama-3.3-70B-Instruct"
llm_client = "local_vllm"

[decision_targets.classifier]
id = "openai/openai/gpt-6-luna"
decision_client = "decisions"

# Best route
[routes.auto]
id = "switchyard/auto"
type = "composite"

[routes.auto.classifier]
target = "classifier"
classify_trigger = "user_turn"
fail_open = false

[routes.auto.classifier.decision]
cutoff = 0.4
candidates = { a = "capable", b = "efficient" }
evidence = { description = "Candidate a is the larger reasoning-oriented coding and thinking model. It is intended for complex problems. Candidate b is the smaller fast coding model. It is intended for simple questions, simple local reads and edits, routine tests and straightforward fixes. These are qualitative deployment roles, not empirical success rates." }

[routes.auto.stage]
capable_target = "capable"
efficient_target = "efficient"
efficient_first_threshold = 0.5
capable_first_threshold = 0.2

# Basic routes

[routes.random]
id = "switchyard/random"
type = "random"
targets = ["capable", "efficient"]

[routes.passthrough]
id = "switchyard/passthrough"
type = "passthrough"
target = "efficient"

[routes.noop]
id = "switchyard/noop"
type = "noop"

# QLC

[routes.qlc]
id = "switchyard/qlc"
type = "qlc"
weight_quality = 0.5
weight_latency = 0
weight_cost = 0.5
max_latency_ms = 60000
require_local = false

[[routes.qlc.candidates]]
target = "capable"
quality_score = 0.8
latency_score = 0.75
cost_score = 0.20
estimated_latency_ms = 1800
context_window = 128000
vision = true
tool_calling = true
local = false

[[routes.qlc.candidates]]
target = "efficient"
quality_score = 0.75
latency_score = 0.8
cost_score = 1
estimated_latency_ms = 900
context_window = 128000
vision = true
tool_calling = true
local = false

